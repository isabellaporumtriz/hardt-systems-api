[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardt-license"
version = "1.0.0"
description = "SDK oficial de licenciamento da Hardt Systems"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "keyring>=25,<26",
]

[tool.setuptools.packages.find]
where = ["src"]
